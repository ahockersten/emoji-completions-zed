[package]
name = "emoji-completions"
version = "1.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "emoji-language-server"
path = "src/server.rs"

[dependencies]
zed_extension_api = "0.7.0"
emojis = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-server = "0.10"
lsp-types = "0.97"
line-index = "0.1"
nucleo-matcher = "0.3"
