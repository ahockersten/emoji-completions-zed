name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose

      - name: Install cross
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --bin emoji-language-server --target ${{ matrix.target }}
          else
            cargo build --release --bin emoji-language-server --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy binary (Unix)
        if: matrix.os_name != 'windows'
        run: |
          mkdir -p release_artifacts
          cp target/${{ matrix.target }}/release/emoji-language-server release_artifacts/emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}
        shell: bash

      - name: Copy binary (Windows)
        if: matrix.os_name == 'windows'
        run: |
          mkdir -p release_artifacts
          copy target\${{ matrix.target }}\release\emoji-language-server.exe release_artifacts\emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}.exe
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.target }}
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
