name: Release

on:
  push:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --bin emoji-language-server --target ${{ matrix.target }}
          else
            cargo build --release --bin emoji-language-server --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Create release artifact
        run: |
          mkdir -p release_artifacts
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cp target/${{ matrix.target }}/release/emoji-language-server.exe release_artifacts/emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}.exe
          else
            cp target/${{ matrix.target }}/release/emoji-language-server release_artifacts/emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}
          fi
        shell: bash

      - name: Compress artifact (Unix)
        if: matrix.os_name != 'windows'
        run: |
          cd release_artifacts
          gzip emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
