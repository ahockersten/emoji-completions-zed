name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The extension downloads the release whose tag matches its version, so a mismatch
      # gives a release that is never used.
      - name: Check tag matches version
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "emoji-completions") | .version')
          extension_version=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml)
          echo "tag: $GITHUB_REF_NAME, Cargo.toml: $cargo_version, extension.toml: $extension_version"
          [ "$cargo_version" = "$GITHUB_REF_NAME" ] && [ "$extension_version" = "$GITHUB_REF_NAME" ]

      - name: Run tests
        run: cargo test --workspace --verbose

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os_name: linux
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os_name: linux
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release -p emoji-language-server --target ${{ matrix.target }}
          else
            cargo build --release -p emoji-language-server --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy binary (Unix)
        if: matrix.os_name != 'windows'
        run: |
          mkdir -p release_artifacts
          cp target/${{ matrix.target }}/release/emoji-language-server release_artifacts/emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}
        shell: bash

      - name: Copy binary (Windows)
        if: matrix.os_name == 'windows'
        run: |
          mkdir -p release_artifacts
          copy target\${{ matrix.target }}\release\emoji-language-server.exe release_artifacts\emoji-language-server-${{ matrix.os_name }}-${{ matrix.arch }}.exe
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;

      - name: Create Release
        # Pinned to a commit because this step runs with write access to the repository.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
